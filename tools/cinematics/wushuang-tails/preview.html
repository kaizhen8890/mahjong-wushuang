<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻将无双 · 神罚裁决</title>
<style>
@font-face{font-family:jianghu;src:url('./preview-assets/Wushuang-Jianghu.ttf')}*{box-sizing:border-box}html,body{margin:0;background:#07090d;color:#e6d8bd;font-family:system-ui,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}header{padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid #695331;background:linear-gradient(110deg,#191222,#0d1017)}h1{font:25px jianghu,serif;letter-spacing:2px;margin:0 auto 0 0;color:#eec67a}nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,select{background:#201c25;color:#eddfc4;border:1px solid #746047;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}button:hover{background:#48362a}button:disabled{opacity:.5}button:focus-visible,select:focus-visible{outline:2px solid #eac67c}label{font-size:13px;white-space:nowrap}input{accent-color:#c7a561}main{flex:1;display:grid;place-items:center;padding:14px;min-height:0}.stage{position:relative;overflow:hidden;background:#030406;width:min(calc((100dvh - 155px)*1.6),calc(100vw - 28px));aspect-ratio:8/5;box-shadow:0 0 70px #27203155;border:1px solid #55472f}.stage.portrait{width:min(calc((100dvh - 155px)*.625),calc(100vw - 28px));aspect-ratio:5/8}video{width:100%;height:100%;display:block;object-fit:contain}.stage:fullscreen{width:100vw;height:100vh;border:0;display:grid;place-items:center}.stage:fullscreen video{object-fit:contain}.foreground{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .32s;background:radial-gradient(ellipse at 27% 70%,#8a60274a,transparent 52%);z-index:3}.foreground.show{opacity:1}.actor{position:absolute;left:-7%;bottom:-28%;height:123%;width:69%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 17px #d6a54b66);opacity:0;transform:translateX(-15%) scale(.9);transition:transform .7s cubic-bezier(.13,.8,.23,1),opacity .45s}.show .actor{opacity:1;transform:none}.caption{position:absolute;right:8%;top:24%;text-align:center}.caption small{font:clamp(14px,2.5vw,35px) jianghu;color:#eac28c;letter-spacing:.25em}.caption b{display:block;font:clamp(28px,5vw,90px) jianghu;background:linear-gradient(#fff0b8,#dda948,#9c511a);background-clip:text;color:transparent;text-shadow:0 6px 24px #af6e124d}.plate{position:absolute;bottom:9%;right:16%;display:flex;align-items:center;gap:10px;padding:7px 24px 7px 7px;border:1px solid #c7a565;border-radius:10px;background:linear-gradient(110deg,#31203f,#14121e);box-shadow:0 0 24px #d8a53333;font:clamp(16px,2.6vw,38px) jianghu}.plate img{width:clamp(34px,6vw,80px);border-radius:7px;border:1px solid #b9995f}.portrait .actor{height:95%;width:110%;left:-30%;bottom:-22%}.portrait .caption{top:19%;right:5%}.portrait .caption b{font-size:clamp(32px,4vw,72px)}.portrait .plate{right:7%;bottom:8%;font-size:24px}.portrait .plate img{width:45px}.goldDust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}footer{font-size:13px;color:#9b9488;padding:0 20px 14px;text-align:center}#status{color:#d9bc83}.error{color:#ffab91}@media(max-width:700px){header{padding:9px;gap:8px}h1{font-size:21px}button,select{padding:6px;font-size:12px}.stage{width:min(calc((100dvh - 185px)*1.6),calc(100vw - 16px))}.stage.portrait{width:min(calc((100dvh - 185px)*.625),calc(100vw - 16px))}main{padding:8px}footer{font-size:11px}}
</style>
<header><h1>反面 · 神罚裁决</h1><nav aria-label="演出预览设置"><select id="orientation" aria-label="画面方向"><option value="landscape">横屏</option><option value="portrait">竖屏</option></select><select id="cut" aria-label="播放内容"><option value="effect">效果 · 6 秒</option><option value="full">掷币＋效果 · 19 秒</option></select><label><input id="sound" type="checkbox" checked>声音</label><label><input id="actorToggle" type="checkbox">目标衔接示意</label><button id="play">播放 / 重播</button><button id="fullscreen">全屏</button></nav></header>
<main><section id="stage" class="stage" aria-label="反面效果动画"><video id="film" playsinline preload="auto"></video><div id="foreground" class="foreground" aria-hidden="true"><img class="actor" src="./preview-assets/portrait.png" alt=""><div class="caption"><small>神罚裁决</small><b>麻将无双</b></div><div class="plate"><img src="./preview-assets/avatar.png" alt=""><span>目标玩家</span></div></div><canvas id="dust" class="goldDust" aria-hidden="true"></canvas></section></main>
<footer><span id="status">准备播放</span> · 目标示意可单独关闭；正式角色与玩家名牌在接入时替换。</footer>
<script type="module">
const $=id=>document.getElementById(id),film=$('film'),stage=$('stage'),foreground=$('foreground'),dust=$('dust'),ctx=dust.getContext('2d');
let raf=0,lastFrame=0,endedAt=0,run=0;const local=location.protocol==='file:';
const cues=[[0,'反面落定'],[.8,'神门降临'],[1.8,'封印解开'],[2.3,'天雷蓄势'],[4.33,'神罚将至'],[4.63,'裁决落下'],[5.3,'目标重击']];
function source(){const ori=$('orientation').value,full=$('cut').value==='full';return local?`./${full?'coin-and-effect':'effect'}-${ori}.mp4`:full?`/showcase/coin-and-effect-${ori}.mp4`:`/cinematics/wushuang-tails/v1/effect-${ori}.mp4`}
function clear(){cancelAnimationFrame(raf);raf=0;endedAt=0;lastFrame=0;foreground.classList.remove('show');ctx.clearRect(0,0,dust.width,dust.height)}
function load(){run++;clear();film.pause();film.src=source();film.muted=!$('sound').checked;stage.classList.toggle('portrait',$('orientation').value==='portrait');film.poster=local?`./effect-${$('orientation').value}.jpg`:`/cinematics/wushuang-tails/v1/effect-${$('orientation').value}.jpg`;film.load();$('status').textContent='准备播放'}
function drawParticles(age){const w=dust.width,h=dust.height;ctx.clearRect(0,0,w,h);if(age<.15||age>1.9)return;const plate=stage.querySelector('.plate').getBoundingClientRect(),rect=stage.getBoundingClientRect(),dest={x:(plate.x-rect.x+plate.width/2)/rect.width*w,y:(plate.y-rect.y+plate.height/2)/rect.height*h};const strike=Math.max(0,1-Math.abs(age-.43)/.28);if(strike){const pts=[];for(let i=0;i<=34;i++){let u=i/34;pts.push([w*.5+(dest.x-w*.5)*u+Math.sin(i*7.31+Math.floor(age*18))*.026*w*Math.sin(Math.PI*u),h*.03+(dest.y-h*.03)*u])}for(const [width,color]of [[10,'#4e92ee'],[3,'#eaf6ff']]){ctx.globalAlpha=strike;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor='#7bbcff';ctx.shadowBlur=24;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}}const u=Math.max(0,Math.min(1,(age-.42)/1.0));if(u>0&&u<1){ctx.globalAlpha=(1-u)*.8;ctx.strokeStyle='#aad8ff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(dest.x,dest.y,u*w*.20,u*w*.10,0,0,Math.PI*2);ctx.stroke();for(let i=0;i<44;i++){const ang=i*2.39996,r=u*w*(.06+(i%11)*.015);ctx.fillStyle=i%4?'#8cc5ff':'#eef8ff';ctx.beginPath();ctx.arc(dest.x+Math.cos(ang)*r,dest.y+Math.sin(ang)*r*.7,1+(i%3),0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.shadowBlur=0}
function tick(now){const offset=$('cut').value==='full'?13:0,time=film.currentTime-offset,age=time-5.3+(film.ended&&endedAt?(now-endedAt)/1000:0);foreground.classList.toggle('show',$('actorToggle').checked&&age>=0);drawParticles($('actorToggle').checked?age:-1);const cue=time<0?'神社掷币':cues.filter(x=>time>=x[0]).at(-1)?.[1]||'反面落定';$('status').textContent=`${cue} · ${film.currentTime.toFixed(1)} / ${film.duration?film.duration.toFixed(0):'—'} 秒`;lastFrame=now;if(!film.ended||($('actorToggle').checked&&age<2.5))raf=requestAnimationFrame(tick)}
function resize(){const r=stage.getBoundingClientRect();dust.width=Math.round(r.width*devicePixelRatio);dust.height=Math.round(r.height*devicePixelRatio)}
new ResizeObserver(resize).observe(stage);
$('play').onclick=async()=>{clear();film.currentTime=0;film.muted=!$('sound').checked;try{await film.play()}catch(e){$('status').textContent='无法播放：'+e.message}};
film.addEventListener('play',()=>{if(!raf)raf=requestAnimationFrame(tick)});film.addEventListener('ended',()=>{endedAt=performance.now()});film.addEventListener('error',()=>{$('status').textContent='视频读取失败';$('status').classList.add('error')});
$('orientation').onchange=load;$('cut').onchange=load;$('sound').onchange=()=>film.muted=!$('sound').checked;
$('actorToggle').onchange=()=>{if(!$('actorToggle').checked){foreground.classList.remove('show');ctx.clearRect(0,0,dust.width,dust.height)}};
$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen();
document.addEventListener('visibilitychange',()=>{if(document.hidden){film.pause();clear()}});load();
window.previewState=()=>({source:film.currentSrc,time:film.currentTime,duration:film.duration,ended:film.ended,foreground:foreground.classList.contains('show'),muted:film.muted,width:film.videoWidth,height:film.videoHeight});
</script></html>
