<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻将无双 · 神社命运掷币</title>
<style>
@font-face{font-family:Wushuang;src:url('/fonts/Wushuang-Jianghu.ttf')}*{box-sizing:border-box}body{margin:0;background:#080b13;color:#e8dec6;font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:14px 4vw;border-bottom:1px solid #b9a3683b;background:linear-gradient(100deg,#211827,#101721)}h1{margin:0;font:28px Wushuang,serif;font-weight:400;letter-spacing:.15em}header span{font-size:12px;color:#a29377;letter-spacing:.18em}.badge{color:#edd193;background:linear-gradient(110deg,#574124,#271725);border:1px solid #a98645;padding:5px 14px;border-radius:20px;font:18px Wushuang,serif;margin-right:12px}main{max-width:1400px;margin:auto;padding:22px 24px}.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:0 0 16px}.group{display:flex;gap:4px;padding:4px;background:#151824;border:1px solid #373544;border-radius:12px}.group button{background:none;border:0;border-radius:8px;padding:8px 17px;color:#958d87}.group button[aria-pressed=true]{background:linear-gradient(110deg,#534026,#2d2735);color:#f0d8a2;box-shadow:inset 0 0 0 1px #a48e525e}.stage{position:relative;background:#020407;border:1px solid #98804f70;border-radius:16px;overflow:hidden;box-shadow:0 16px 70px #0008;width:min(100%,calc((100dvh - 310px)*1.6));aspect-ratio:16/10;max-height:calc(100dvh - 310px);margin:auto}.stage[data-shape=portrait]{aspect-ratio:10/16;width:auto;height:calc(100dvh - 310px)}video{width:100%;height:100%;object-fit:contain;display:block}.stage:fullscreen{border:0;border-radius:0;max-height:none;aspect-ratio:auto;height:100%;width:100%}.result{position:absolute;inset:auto 0 5%;text-align:center;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .65s,transform .65s;text-shadow:0 2px 16px #000,0 0 35px #000}.result.show{opacity:1;transform:none}.result b{display:block;font:clamp(30px,4vw,58px) Wushuang,serif;letter-spacing:.24em;color:#ffe4a6}.result small{display:block;color:#c7b894;letter-spacing:.2em;margin-top:5px;font-size:12px}.controls{display:flex;gap:10px;align-items:center;margin-top:14px}.controls button{border:1px solid #8d784c6b;background:#211c25;padding:9px 17px;border-radius:9px}.controls button:first-child{background:linear-gradient(120deg,#7b6030,#3a2934);color:#ffe9b6}.controls output{margin-left:auto;color:#9c968b;font-variant-numeric:tabular-nums;font-size:12px}.note{color:#7d7a79;font-size:12px;margin-top:14px;line-height:1.7}@media(max-width:700px){header{height:64px;padding:10px 16px}h1{font-size:21px}header>span{display:none}main{padding:15px 12px}.toolbar{gap:6px}.group button{padding:7px 10px;font-size:13px}.controls{gap:6px}.controls button{padding:8px 10px;font-size:13px}.stage{max-height:calc(100dvh - 280px)}.stage[data-shape=portrait]{height:calc(100dvh - 280px)}}
</style></head><body>
<header><h1><b class="badge">无双</b>神社 · 命运掷币</h1><span>MAHJONG WUSHUANG / CINEMATIC 01</span></header>
<main><div class="toolbar"><div class="group" aria-label="样片结局"><button data-result="heads" aria-pressed="true">正面 · 无双</button><button data-result="tails" aria-pressed="false">反面 · 四风</button></div><div class="group" aria-label="画面方向"><button data-shape="landscape" aria-pressed="true">横屏</button><button data-shape="portrait" aria-pressed="false">竖屏</button></div></div>
<div class="stage" data-shape="landscape"><video playsinline preload="metadata" aria-label="神社掷币动画"></video><div class="result"><b>正面</b><small>麻将无双</small></div></div>
<div class="controls"><button id="play">播放演出</button><button id="mute" aria-pressed="false">声音：开</button><button id="full">全屏</button><output>13 秒 · 空中翻转 6.5 秒</output></div>
<p class="note">可切换正反面样片查看两个结局。实际卡牌效果将在规则确定后接入。</p></main>
<script>
const base='/cinematics/wushuang-coin/v1/',v=document.querySelector('video'),stage=document.querySelector('.stage'),result=document.querySelector('.result'),play=document.querySelector('#play'),meter=document.querySelector('output');
let outcome='heads',shape=innerHeight>innerWidth?'portrait':'landscape';
function select(){v.pause();v.src=base+outcome+'-'+shape+'.mp4';v.poster=base+outcome+'-'+shape+'.jpg';stage.dataset.shape=shape;result.classList.remove('show');result.querySelector('b').textContent=outcome==='heads'?'正面':'反面';result.querySelector('small').textContent=outcome==='heads'?'麻将无双':'四风之印';document.querySelectorAll('[data-result]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.result===outcome));document.querySelectorAll('button[data-shape]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.shape===shape));play.textContent='播放演出';meter.textContent='13 秒 · 空中翻转 6.5 秒';}
document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{outcome=b.dataset.result;select()});document.querySelectorAll('button[data-shape]').forEach(b=>b.onclick=()=>{shape=b.dataset.shape;select()});
play.onclick=async()=>{if(v.ended)v.currentTime=0;if(v.paused){try{await v.play()}catch{meter.textContent='点击画面播放';v.controls=true}}else v.pause()};
v.onplay=()=>{play.textContent='暂停';result.classList.remove('show')};v.onpause=()=>play.textContent=v.ended?'重新播放':'继续播放';v.onended=()=>{play.textContent='重新播放';result.classList.add('show')};v.ontimeupdate=()=>{result.classList.toggle('show',v.currentTime>=11.25);meter.textContent=v.currentTime.toFixed(1)+' / 13.0 秒'};v.onerror=()=>meter.textContent='影片无法读取，请重新选择';
document.querySelector('#mute').onclick=e=>{v.muted=!v.muted;e.currentTarget.setAttribute('aria-pressed',v.muted);e.currentTarget.textContent='声音：'+(v.muted?'关':'开')};document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen?.()};document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause()});v.volume=.85;select();
</script></body></html>
