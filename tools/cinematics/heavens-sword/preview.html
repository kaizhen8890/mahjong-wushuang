<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听天问剑 · 断天三斩</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c12;color:#ffebc4;font-family:system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}small,.hint{color:#baad9b}h1{font-size:28px;margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button{font:inherit;padding:9px 16px;border:1px solid #665646;border-radius:6px;color:#ffebc4;background:#20232c;cursor:pointer}button[aria-pressed=true]{background:#522723;border-color:#e88950}.stage{aspect-ratio:16/10;background:#080a0e;border:1px solid #5a4b3c;overflow:hidden;border-radius:8px;margin:auto}.stage.portrait{aspect-ratio:10/16;max-width:50vh;max-height:80vh}video{display:block;width:100%;height:100%;object-fit:contain}.bar{height:4px;background:#20222b;margin-top:10px}.bar div{width:0;height:100%;background:linear-gradient(90deg,#e94423,#91d4ff)}footer{display:flex;justify-content:space-between;gap:10px;margin:12px 0;font-size:14px}.hint{font-size:13px}@media(max-width:550px){main{padding:12px}h1{font-size:23px}button{padding:8px 11px}}
</style><main><header><div><small>无双神卡 · 动画素材 v1.0.0</small><h1>听天问剑 · 断天三斩</h1></div><button id="full">全屏</button></header><nav><button id="heads" aria-pressed="true">正面 · 五张技能卡</button><button id="tails" aria-pressed="false">反面 · 飞牌</button><button id="landscape" aria-pressed="true">横屏</button><button id="portrait" aria-pressed="false">竖屏</button><button id="play">播放 / 重播</button><button id="pause">暂停</button><button id="mute" aria-pressed="false">声音：开</button></nav><div id="stage" class="stage"><video id="film" src="effect-heads-landscape.mp4" poster="effect-heads-landscape.jpg" playsinline preload="auto" controls></video></div><div class="bar"><div id="progress"></div></div><footer><span id="status">11 秒 · 30 fps · 含声音</span><span id="ending">正面 · 每次摸牌额外抽取 5 张技能卡</span></footer><p class="hint">独立发动动画预览，不含前置掷币。尚未接入游戏；现实手牌与技能卡仍需按卡面执行。</p></main><script>
const v=document.getElementById('film'),stage=document.getElementById('stage');let ori='landscape',ending='heads';function update(){document.getElementById('status').textContent=`${v.currentTime.toFixed(1)} / 11.0 秒`;document.getElementById('progress').style.width=`${v.currentTime/11*100}%`;}function choose(){v.pause();v.src=`effect-${ending}-${ori}.mp4`;v.poster=`effect-${ending}-${ori}.jpg`;stage.classList.toggle('portrait',ori==='portrait');for(const o of ['landscape','portrait'])document.getElementById(o).setAttribute('aria-pressed',ori===o);for(const o of ['heads','tails'])document.getElementById(o).setAttribute('aria-pressed',ending===o);document.getElementById('ending').textContent=ending==='heads'?'正面 · 每次摸牌额外抽取 5 张技能卡':'反面 · 选择并明示一张手牌作为「飞」';v.load();update();}for(const o of ['landscape','portrait'])document.getElementById(o).onclick=()=>{ori=o;choose();};for(const o of ['heads','tails'])document.getElementById(o).onclick=()=>{ending=o;choose();};document.getElementById('play').onclick=()=>{v.currentTime=0;v.play().catch(()=>document.getElementById('status').textContent='请再次点击播放');};document.getElementById('pause').onclick=()=>v.pause();document.getElementById('mute').onclick=e=>{v.muted=!v.muted;e.target.setAttribute('aria-pressed',v.muted);e.target.textContent=`声音：${v.muted?'关':'开'}`;};document.getElementById('full').onclick=()=>stage.requestFullscreen?.();v.addEventListener('timeupdate',update);v.addEventListener('error',()=>document.getElementById('status').textContent='视频加载失败，请保留同目录的影片文件');document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();});
</script></html>
