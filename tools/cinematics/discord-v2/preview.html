<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>断序杂音 · 崩界铸刃</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0717;color:#dedafa;font-family:system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{margin:8px 0;font-size:28px}small{color:#b1a3d2}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;color:#ece5ff;background:#272040;border:1px solid #605385;padding:9px 17px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#493275;border-color:#bd93ff}.stage{position:relative;aspect-ratio:16/10;background:#080512;overflow:hidden;border:1px solid #4c4269;border-radius:12px;margin:auto;isolation:isolate}.stage.portrait{aspect-ratio:10/16;max-height:80vh;max-width:50vh}video{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .3s}.handoff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse,#28203b22,#160b2777)}.return .handoff{opacity:1}.return video{opacity:.3}.title{font-size:clamp(28px,6vw,74px);letter-spacing:.12em;color:#e0edff;text-shadow:0 0 18px #975dff;margin:0 0 14px}.ward{display:flex;gap:20px;margin:26px 0}.plate{border:1px solid #86c6e6;border-radius:16px;padding:20px 30px;box-shadow:0 0 30px #8445dd,inset 0 0 22px #574fa955;background:#151128b8;animation:shield .8s ease-out both}.plate:nth-child(2){animation-delay:.08s}@keyframes shield{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}.portrait .title{font-size:34px}.portrait .plate{padding:14px}.portrait .ward{gap:8px}footer{display:flex;justify-content:space-between;gap:12px;color:#b9accb;padding:14px 0;font-size:13px}label{display:flex;align-items:center;gap:7px}.status{font-variant-numeric:tabular-nums}a{color:#c6a7ff}.hint{font-size:14px;color:#ab9fc5}
</style><main><header><div><small>无双神卡 · 动画 v1.1.0</small><h1>断序杂音 · 崩界铸刃</h1></div><button id="full">全屏</button></header><nav><button id="land" aria-pressed="true">横屏</button><button id="port" aria-pressed="false">竖屏</button><button id="play">播放 / 重播</button><button id="pause">暂停</button><button id="mute" aria-pressed="false">声音：开</button><label><input type="checkbox" id="overlay">展示结尾名牌衔接</label></nav><div class="stage" id="stage"><video id="film" playsinline preload="auto" poster="effect-landscape.jpg" src="effect-landscape.mp4"></video><div class="handoff"><h2 class="title">断序杂音</h2><div>己方获得断序保护</div><div class="ward"><div class="plate">发动者</div><div class="plate">队友</div></div></div></div><footer><span id="status">8 秒 · 30 fps · 内含音效</span><span>3D 预渲染影片＋名牌衔接示意</span></footer><p class="hint">影片不包含玩家身份。这里的名牌仅演示保护效果位置，游戏接入时应使用真实己方玩家。关闭衔接选项可完整观看原片。</p></main><script>
const v=document.getElementById('film'),stage=document.getElementById('stage'),status=document.getElementById('status'),overlay=document.getElementById('overlay');let orientation='landscape';function update(){stage.classList.toggle('return',overlay.checked&&v.currentTime>=6.8);status.textContent=`${v.currentTime.toFixed(1)} / 8.0 秒 · ${orientation==='landscape'?'横屏':'竖屏'}`;}function choose(ori){v.pause();orientation=ori;v.src=`effect-${ori}.mp4`;v.poster=`effect-${ori}.jpg`;stage.classList.toggle('portrait',ori==='portrait');document.getElementById('land').setAttribute('aria-pressed',ori==='landscape');document.getElementById('port').setAttribute('aria-pressed',ori==='portrait');stage.classList.remove('return');v.load();update();}document.getElementById('land').onclick=()=>choose('landscape');document.getElementById('port').onclick=()=>choose('portrait');document.getElementById('play').onclick=()=>{v.currentTime=0;stage.classList.remove('return');v.play().catch(()=>{status.textContent='请再次点击播放';});};document.getElementById('pause').onclick=()=>v.pause();document.getElementById('mute').onclick=e=>{v.muted=!v.muted;e.target.textContent=`声音：${v.muted?'关':'开'}`;e.target.setAttribute('aria-pressed',v.muted);};document.getElementById('full').onclick=()=>stage.requestFullscreen?.();overlay.onchange=update;v.addEventListener('timeupdate',update);v.addEventListener('error',()=>status.textContent='视频加载失败，请确认同目录的影片文件');document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();});
</script></html>
