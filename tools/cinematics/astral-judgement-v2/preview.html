<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿星审判 · 万星齐发</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0617;color:#f0eaf9;font-family:system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:28px;margin:8px 0}small,.hint{color:#b9a6d0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{font:inherit;padding:9px 17px;background:#29203b;color:#f7f0ff;border:1px solid #6c527e;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#573478;border-color:#be91e2}.stage{aspect-ratio:16/10;border:1px solid #66507c;border-radius:10px;overflow:hidden;background:#080413;margin:auto}.stage.portrait{aspect-ratio:10/16;max-width:50vh;max-height:80vh}video{width:100%;height:100%;object-fit:contain;display:block}footer{display:flex;justify-content:space-between;gap:10px;color:#c2b0d5;font-size:13px;padding:14px 0}.hint{font-size:14px}.timeline{height:5px;background:#24172f;border-radius:5px;overflow:hidden}.timeline div{height:100%;width:0;background:linear-gradient(90deg,#a759de,#f6efff)}@media(max-width:550px){main{padding:12px}h1{font-size:23px}button{padding:8px 12px}}
</style><main><header><div><small>无双神卡 · 动画 v1.1.0</small><h1>宿星审判 · 万星齐发</h1></div><button id="full">全屏</button></header><nav><button id="land" aria-pressed="true">横屏</button><button id="port" aria-pressed="false">竖屏</button><button id="play">播放 / 重播</button><button id="pause">暂停</button><button id="mute" aria-pressed="false">声音：开</button></nav><div id="stage" class="stage"><video id="film" src="effect-landscape.mp4" poster="effect-landscape.jpg" preload="auto" playsinline></video></div><div class="timeline"><div id="progress"></div></div><footer><span id="status">10 秒 · 30 fps · 内含声音</span><span>白百合 · 满屏弹幕 · 瞬发审判</span></footer><p class="hint">片尾为华文中宋，白色字面、紫色描边。此处为独立动画预览，尚未接入游戏。</p></main><script>
const v=document.getElementById('film'),stage=document.getElementById('stage');let ori='landscape';function update(){document.getElementById('status').textContent=`${v.currentTime.toFixed(1)} / 10.0 秒 · ${ori==='landscape'?'横屏':'竖屏'}`;document.getElementById('progress').style.width=`${v.currentTime/10*100}%`;}function choose(o){v.pause();ori=o;v.src=`effect-${o}.mp4`;v.poster=`effect-${o}.jpg`;stage.classList.toggle('portrait',o==='portrait');document.getElementById('land').setAttribute('aria-pressed',o==='landscape');document.getElementById('port').setAttribute('aria-pressed',o==='portrait');v.load();update();}document.getElementById('land').onclick=()=>choose('landscape');document.getElementById('port').onclick=()=>choose('portrait');document.getElementById('play').onclick=()=>{v.currentTime=0;v.play().catch(()=>document.getElementById('status').textContent='请再次点击播放');};document.getElementById('pause').onclick=()=>v.pause();document.getElementById('mute').onclick=e=>{v.muted=!v.muted;e.target.textContent=`声音：${v.muted?'关':'开'}`;e.target.setAttribute('aria-pressed',v.muted);};document.getElementById('full').onclick=()=>stage.requestFullscreen?.();v.addEventListener('timeupdate',update);v.addEventListener('error',()=>document.getElementById('status').textContent='视频加载失败，请保留同目录的影片文件');document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();});
</script></html>
